{{define "organization-detail-dialog"}}
<dialog
  class="modal modal-narrow"
  id="organization-dialog"
  aria-labelledby="organization-dialog-title"
  {{if .SelectedOrganizationID}}data-open-on-load data-organization-id="{{.SelectedOrganizationID}}"{{end}}
  {{if .EditOrganizationForm.HasErrors}}data-start-with-errors{{end}}
  {{if .EditOrganizationForm.Saved}}data-start-saved{{end}}
>
  <form class="modal-panel" method="post" action="/organizations/{{.SelectedOrganizationID}}" data-organization-form data-flash="Organization saved">
    <header class="modal-header">
      <div class="modal-title-row">
        <span class="org-mark org-mark-large" aria-hidden="true" data-org-field="mark"></span>
        <div>
          <h2 id="organization-dialog-title" data-org-field="title">{{.EditOrganizationForm.Name}}</h2>
          <p><a href="/applications" data-org-field="applications-link"><span data-org-field="summary">Linked applications</span> {{template "icon" "arrow-right"}}</a></p>
        </div>
      </div>
      <button class="icon-button" type="button" data-close aria-label="Close organization editor">{{template "icon" "x"}}</button>
    </header>

    <div class="modal-body">
      {{with .EditOrganizationForm.GeneralError}}<p class="form-alert" role="alert">{{template "icon" "alert"}}{{.}}</p>{{end}}
      <div class="form-grid form-grid-single">
        <label class="field">
          <span class="field-label">Name</span>
          <input type="text" name="name" autocomplete="organization" value="{{.EditOrganizationForm.Name}}" required {{if .EditOrganizationForm.NameError}}aria-invalid="true" aria-describedby="organization-name-error"{{end}}>
          {{with .EditOrganizationForm.NameError}}<small class="field-error" id="organization-name-error">{{.}}</small>{{end}}
        </label>

        <label class="field">
          <span class="field-label">Career portal URL <small>Optional</small></span>
          <input type="url" name="careers_url" inputmode="url" placeholder="https://" value="{{.EditOrganizationForm.CareersURL}}" {{if .EditOrganizationForm.CareersURLError}}aria-invalid="true" aria-describedby="organization-careers-url-error"{{end}}>
          {{with .EditOrganizationForm.CareersURLError}}<small class="field-error" id="organization-careers-url-error">{{.}}</small>{{end}}
          <small class="field-hint">Used for one-click portal checks on every application at this organization.</small>
        </label>
      </div>
    </div>

    <footer class="modal-footer">
      <span class="shortcut-hint">Renaming updates every linked application.</span>
      <div class="modal-actions">
        <button class="button button-ghost" type="button" data-close>Cancel</button>
        <button class="button button-primary" type="submit">Save</button>
      </div>
    </footer>
  </form>
</dialog>
{{end}}
